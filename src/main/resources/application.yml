spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      "local": "localPort, localRDB, localMongodb, localRedis, localAws, localJPA, localSecret"
      "dev": "devPort, devRDB, devMongodb, devRedis, devAws, devJPA, devSecret"
---
spring:
  config:
    activate:
      on-profile: "devPort"

server:
  port: 8080
---
spring:
  config:
    activate:
      on-profile: "devRDB"

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.sql: debug
---
spring:
  config:
    activate:
      on-profile: "devMongodb"

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

---
spring:
  config:
    activate:
      on-profile: "devRedis"

redis:
  sentinel:
    master: ${REDIS_SENTINEL_MASTER}
    host: ${REDIS_SENTINEL_HOST}
    port: ${REDIS_SENTINEL_PORT}
  #    nodes:
  #      - redis-node-0.redis-headless
  #      - redis-node-1.redis-headless
  #      - redis-node-2.redis-headless

  password: ${REDIS_PASSWORD}

  lettuce:
    pool:
      max-active: ${REDIS_ACTIVE}
      max-idle: ${REDIS_MAX_IDLE}
      min-idle: ${REDIS_MIN_IDLE}

  timeout: ${REDIS_TIMEOUT}

---

spring:
  config:
    activate:
      on-profile: "devAws"
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      buckets:
        original: ${AWS_ORIGINAL_BUCKET}
        img: ${AWS_IMG_BUCKET}
      presign:
        upload-expiration: ${AWS_UPLOAD_EXPIRATION}
    cloudfront:
      domain: ${CDN_BASE_URL}
      key-pair-id: ${CF_KEY_PAIR_ID}
      cookie-ttl-seconds: ${CF_COOKIE_TTL}
      private-key-base64: ${CF_PRIVATE_KEY_BASE64}
---

spring:
  config:
    activate:
      on-profile: "devJPA"

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        show_sql: true
---
spring:
  config:
    activate:
      on-profile: "devSecret"

secret:
  jwt:
    secret-key: ${TOKEN_SECRET_KEY}
    expired-in: ${TOKEN_EXPIRED_IN}
