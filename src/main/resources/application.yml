spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      "local": "localPort, localRDB, localMongodb, localRedis, localS3, localJPA, localSecret"
      "dev": "devPort, devRDB, devMongodb, devRedis, devS3, devJPA, devSecret"
---
spring:
  config:
    activate:
      on-profile: "devPort"

server:
  port: 8080
---
spring:
  config:
    activate:
      on-profile: "devRDB"

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.sql: debug
---
spring:
  config:
    activate:
      on-profile: "devMongodb"

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

---
spring:
  config:
    activate:
      on-profile: "devRedis"

 data:
   redis:
     host: ${REDIS_HOST}
     port: ${REDIS_PORT}
     password: ${REDIS_PASSWORD}
     lettuce:
       pool:
         max-active: ${REDIS_ACTIVE}
         max-idle: ${REDIS_MAX_IDLE}
         min-idle: ${REDIS_MIN_IDLE}
     timeout: ${REDIS_TIMEOUT}

---

spring:
  config:
    activate:
      on-profile: "devS3"
cloud:
  aws:
    credentials:
#      access-key: ${S3-ACCESS-KEY}
#      secret-key: ${S3-SECRET-KEY}
#        s3:
#          bucket: project-space-image-storage
#    region:
#      static: ap-northeast-2 # 리전 정보(서울)
#    stack:
#      auto: false

---

spring:
  config:
    activate:
      on-profile: "devJPA"

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        show_sql: true
---
spring:
  config:
    activate:
      on-profile: "devSecret"

secret:
  jwt:
    secret-key: ${TOKEN_SECRET_KEY}
    expired-in: ${TOKEN_EXPIRED_IN}
