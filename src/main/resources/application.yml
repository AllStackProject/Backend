spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      "local": "localPort, localRDB, localRedis, localS3, localJPA, localSecret"
      "dev": "devPort, devRDB, devRedis, devS3, devJPA, devSecret"
---
spring:
  config:
    activate:
      on-profile: "devPort"

server:
  port: 8080
---
spring:
  config:
    activate:
      on-profile: "devRDB"

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: jdbc:mysql://com.mysql.cj.jdbc.Driver
logging:
  level:
    org.hibernate.sql: debug

---
spring:
  config:
    activate:
      on-profile: "devRedis"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

---

spring:
  config:
    activate:
      on-profile: "devS3"
cloud:
  aws:
    credentials:
      access-key: ${S3-ACCESS-KEY}
      secret-key: ${S3-SECRET-KEY}
    #    s3:
    #      bucket: project-space-image-storage
    region:
      static: ap-northeast-2 # 리전 정보(서울)
    stack:
      auto: false

---

spring:
  config:
    activate:
      on-profile: "devJPA"

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        show_sql: true
---
spring:
  config:
    activate:
      on-profile: "devSecret"

secret:
  jwt:
    access-secret-key: ${ACCESS_SECRET_KEY}
    refresh-secret-key: ${REFRESH_SECRET_KEY}
    access-expired-in: ${ACCESS_EXPIRED_IN}
    refresh-expired-in: ${REFRESH_EXPIRED_IN}
